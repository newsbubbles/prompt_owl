<!doctype html>
<meta charset="utf-8">
<title>Prompt Owl</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/prowl_logo.png" type="image/png">
<link rel="stylesheet" href="/style.css">

<header>
  <!-- The owl is the name. `prowl` is a file extension and a module import; if this is known by
       one name it is Prompt Owl. -->
  <img id="mark" src="/prowl_logo.png" alt="Prompt Owl" title="Prompt Owl" width="25" height="29">
  <select id="ws-pick" title="workspace"></select>
  <button id="ws-new" class="ghost" title="new workspace">+</button>
  <div class="finder">
    <input id="model" placeholder="search models…" spellcheck="false" autocomplete="off">
    <div id="picker" class="picker" hidden></div>
  </div>
  <input id="provider" placeholder="pin provider" spellcheck="false" title="Pin one backend, e.g. DeepInfra. One model id is served by several backends at different quantization, and they do not answer the same way. Leave this empty and a comparison measures routing.">
  <div id="models" class="models"></div>
  <label class="check"><input type="checkbox" id="atomic"> atomic</label>
  <label class="check" title="Talk to /v1/chat/completions instead of /v1/completions. The growing document goes into a pre-started assistant turn and the model carries on writing it. Same mechanism, different envelope. Costs 19-91% more tokens, because the user turn is re-sent on every declaration."><input type="checkbox" id="chat"> chat</label>
  <label class="check" title="Run the stack this many times. One fill is an anecdote; a distribution needs repeats, and every value is kept in History."><span>×</span><input type="number" id="repeats" min="1" max="200" step="1" value="1"></label>
  <button id="run" class="go">▶ Run</button>
  <button id="stop" class="go stop" hidden>■ Stop</button>
  <div id="status" class="pill">connecting…</div>
  <select id="theme" title="theme"></select>
</header>

<main>
  <aside>
    <div class="head"><span>scripts</span><button id="script-new" class="ghost wide">+ new</button></div>
    <ul id="browser" class="list"></ul>
    <div class="head" id="stacks-head"><span>stacks</span><button id="stack-new" class="ghost wide" title="start a new, empty stack">+ new</button></div>
    <ul id="stacks" class="list"></ul>
  </aside>

  <section class="center">
    <div id="stack" class="stack">
      <div class="stack-empty">Click a script to add it to the stack.</div>
    </div>
    <div class="ed">
      <pre class="hl" aria-hidden="true"><code id="hl"></code></pre>
      <textarea id="editor" spellcheck="false" placeholder="Select a script from the stack."></textarea>
    </div>
    <div id="caret" class="caret-bar"></div>
    <div id="lints" class="lints"></div>
    <div id="inputs" class="inputs"></div>
    <div id="forecast" class="forecast"></div>
  </section>

  <section class="results">
    <div class="tabbar sub">
      <button data-pane="document" class="on">Document</button>
      <button data-pane="compare">Compare</button>
      <button data-pane="variables">Variables</button>
      <button data-pane="history">History</button>
      <button data-pane="errors">Errors</button>
      <button data-pane="raw">Raw</button>
    </div>
    <div id="pane-document" class="pane"><div class="hint">Run the stack to see the document it builds.</div></div>
    <div id="pane-compare" class="pane" hidden><div class="hint">Add two or more models to compare them variable by variable.</div></div>
    <div id="pane-variables" class="pane" hidden></div>
    <div id="pane-history" class="pane" hidden></div>
    <div id="pane-errors" class="pane" hidden></div>
    <div id="pane-raw" class="pane" hidden></div>
    <div id="usage" class="usage"></div>
  </section>
</main>

<script type="module" src="/app.js"></script>
